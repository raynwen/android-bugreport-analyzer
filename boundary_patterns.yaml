# ================================================================================
# 日志行模式 (Line Patterns) - 完整版
# ================================================================================

line_patterns:

  # Logcat 行格式: 12-30 10:00:00.571  root  1123  1123 D io_stats
  logcat_line:
    pattern: "^(\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2}\\.\\d{3})\\s+(\\S+)\\s+(\\d+)\\s+(\\d+)\\s+([A-Z])\\s+(.+)$"
    groups:
      timestamp: 1
      tag: 2
      pid: 3
      tid: 4
      level: 5
      message: 6

  # Kernel log 行格式: [    0.000000] message
  kernel_line:
    pattern: "^\\[\\s*(\\d+\\.\\d+)\\]\\s+(.+)$"
    groups:
      timestamp: 1
      message: 2

  # 进程 trace 行格式
  trace_line:
    pattern: "^(.+)\\s+at\\s+(.+)$"
    groups:
      thread_info: 1
      stack_frame: 2

  # 系统属性行格式
  property_line:
    pattern: "^(\\[.*?\\])\\s*\\[.*?\\]:\\s*\\[(.*?)\\]\\s*(.*)$"
    groups:
      timestamp: 1
      key: 2
      value: 3

# ================================================================================
# 关键字配置 (用于快速定位问题)
# ================================================================================

keywords:

  critical:
    - "FATAL"
    - "ANR"
    - "crash"
    - "died"
    - "force finish"
    - "Application Not Responding"
    - "Native crash"
    - "tombstone"
    - "*** *** ***"
    - "SIGKILL"
    - "signal 9"

  error:
    - "ERROR"
    - "Exception"
    - "failed"
    - "timeout"
    - "Process.*exit"
    - "has died"
    - "not responding"
    - "Transaction failed"
    - "binder error"

  warning:
    - "WARN"
    - "Slow"
    - "delay"
    - "blocking"
    - "waited too long"
    - "binder transaction"
    - "CPU idle"

  performance:
    - "binder transaction"
    - "binder call"
    - "CPU usage"
    - "memory pressure"
    - "low memory"
    - "kswapd"
    - "ion heap"
    - "GPU timeout"
    - "SurfaceFlinger"
    - "frame deadline"

# ================================================================================
# 分块配置 (Chunking)
# =============================================================================

chunking:

  default_size: 5242880  # 5MB
  min_size: 1048576      # 1MB
  max_size: 10485760     # 10MB

  by_section: true

  # 需要完整保留的章节 (不拆分)
  preserve_sections:
    - "dumpsys_critical"
    - "dumpsys_high"
    - "dumpsys_normal"
    - "system_log"
    - "kernel_log"
    - "binder_state"
    - "vm_traces_just_now"
    - "vm_traces_anr"
    - "display_debug"


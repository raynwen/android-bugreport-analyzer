# Android Bug Report 边界模式配置 (基于 dumpstate.txt 实际结构)
# 作者: 闫文峰
# 版本: 2.0 - 完整版
# 源文件: dumpstate.txt (196.4 MB)
# 设备: SM-F9660 (Samsung Android 16)

version: "2.0"

# ================================================================================
# 边界分隔符总表 (所有发现的特殊字符模式)
# ================================================================================

boundary_markers:

  # 类型1: 等号分隔符 (文件头/章节标题)
  # 示例: ========================================================
  equals_separator:
    pattern: "^={20,}$"
    description: "文件头或大章节标题分隔符"
    usage: ["header", "major_section"]
    line_examples:
      - "========================================================"
      - "==================== Basic dump state ===================="

  # 类型2: 短横线分隔符 (章节标题)
  # 示例: ------ MEMORY INFO (/proc/meminfo) ------
  dash_separator:
    pattern: "^------ .+ ------$"
    description: "标准章节标题分隔符"
    usage: ["section_header", "chapter_title"]
    line_examples:
      - "------ MEMORY INFO (/proc/meminfo) ------"
      - "------ DUMPSYS CRITICAL (/system/bin/dumpsys) ------"

  # 类型3a: 大章节持续时间标记 (章节结束)
  # 示例: ------ 0.012s was the duration of 'MEMORY INFO' ------
  duration_marker_major:
    pattern: "^------ \\d+\\.\\d+s was the duration of"
    description: "大章节执行时间标记，表示主章节结束"
    usage: ["major_section_end"]
    line_examples:
      - "------ 0.012s was the duration of 'MEMORY INFO' ------"
      - "------ 1.067s was the duration of 'DUMPSYS CRITICAL' ------"

  # 类型3b: dumpsys 子章节持续时间标记
  # 示例: --------- 0.297s was the duration of dumpsys activity, ending at: 2025-12-30 10:00:21
  duration_marker_dumpsys:
    pattern: "^---------+ \\d+\\.\\d+s was the duration of dumpsys"
    description: "dumpsys 内部子章节结束标记"
    usage: ["dumpsys_subsection_end"]
    line_examples:
      - "--------- 0.297s was the duration of dumpsys activity, ending at: 2025-12-30 10:00:21"
      - "--------- 0.027s was the duration of dumpsys SurfaceFlinger, ending at: 2025-12-30 10:00:20"

  # 类型4: 星号分隔符 (电池日志/崩溃信息)
  # 示例: *****Battery Power On Logs*****
  asterisk_separator:
    pattern: "^\\*{3,}.+\\*{3,}$"
    description: "电池日志或特殊标记"
    usage: ["battery_log", "special_marker"]
    line_examples:
      - "*****Battery Power On Logs*****"
      - "*****Battery LPM Logs*****"
      - "*****Battery LPM Logs End*****"

  # 类型5: 井号分隔符 (Samsung dumpsys 服务)
  # 示例: ##### SEP UNION Main SERVICE #####
  hash_separator:
    pattern: "^#{3,}.+#{3,}$"
    description: "Samsung 特定系统服务 dumpsys"
    usage: ["samsung_dumpsys", "service_dump"]
    line_examples:
      - "##### SEP UNION Main SERVICE #####"
      - "##### SmartManagerService  #####"
      - "##### DUMP OF Theme #####"

  # 类型6: 进程 Trace 开始
  # 示例: ----- pid 933 at 2025-12-30 10:00:23.843902874+0800 -----
  trace_start:
    pattern: "^----- pid \\d+ at"
    description: "进程堆栈跟踪开始"
    usage: ["trace_begin", "stack_trace"]
    line_examples:
      - "----- pid 933 at 2025-12-30 10:00:23.843902874+0800 -----"

  # 类型7: 进程 Trace 结束
  # 示例: ----- end 933 -----
  trace_end:
    pattern: "^----- end \\d+$"
    description: "进程堆栈跟踪结束"
    usage: ["trace_end"]
    line_examples:
      - "----- end 933 -----"

  # 类型8: Waiting Channels (等待通道)
  waiting_channels:
    pattern: "^----- Waiting Channels:"
    description: "进程等待的 Binder 通道"
    usage: ["binder_wait"]
    line_examples:
      - "----- Waiting Channels: pid 1659 at 2025-12-30 10:00:23.847556780+0800 -----"

  # 类型9: dumpsys 内部小标题
  # 示例: ---------SurfaceFlinger Effects--------
  dumpsys_subheader:
    pattern: "^---------+.+---------$"
    description: "dumpsys 输出内部子章节"
    usage: ["dumpsys_subsection"]
    line_examples:
      - "---------SurfaceFlinger Effects--------"
      - "------------------+----+-------------"

  # 类型10: 内核日志时间戳
  # 示例: [175555.553540] [0:    kworker/0:2:12056] message
  kernel_timestamp:
    pattern: "^\\[\\s*\\d+\\.\\d+\\]"
    description: "内核日志时间戳"
    usage: ["kernel_log", "dmesg"]
    line_examples:
      - "[175555.553540] [0:    kworker/0:2:12056] max77775: max77775_usbc_opcode_read"

# ================================================================================
# 记录类型定义 (Record Types) - 完整版
# ================================================================================

record_types:

  # ============================================================================
  # 1. 文件头信息 (Header)
  # ============================================================================
  header:
    priority: LOW
    category: "meta"
    boundary_type: "equals_separator"
    description: "Bugreport 文件头信息"
    start_pattern: "^==+$"
    end_pattern: "^------ MEMORY INFO"
    example: "========================================================"
    line_count_estimate: 10

  # ============================================================================
  # 2. 内存信息 (Memory)
  # ============================================================================
  memory_info:
    priority: MEDIUM
    category: "system"
    boundary_type: "dash_separator"
    description: "内存信息 (/proc/meminfo)"
    start_pattern: "^------ MEMORY INFO"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'MEMORY INFO'"
    line_count_estimate: 60
    size_estimate_kb: 10

  vmstat:
    priority: LOW
    category: "system"
    boundary_type: "dash_separator"
    description: "虚拟内存统计 (/proc/vmstat)"
    start_pattern: "^------ VIRTUAL MEMORY STATS"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'VIRTUAL MEMORY STATS'"
    line_count_estimate: 160

  # ============================================================================
  # 3. Binder 信息 (Binder) - 性能分析关键
  # ============================================================================
  binder_failed_transaction:
    priority: HIGH
    category: "binder"
    boundary_type: "dash_separator"
    description: "Binder 失败事务日志"
    start_pattern: "^------ BINDER FAILED TRANSACTION LOG"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'BINDER FAILED TRANSACTION LOG'"
    line_count_estimate: 35

  binder_transaction:
    priority: HIGH
    category: "binder"
    boundary_type: "dash_separator"
    description: "Binder 事务日志"
    start_pattern: "^------ BINDER TRANSACTION LOG"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'BINDER TRANSACTION LOG'"
    line_count_estimate: 35

  binder_stats:
    priority: MEDIUM
    category: "binder"
    boundary_type: "dash_separator"
    description: "Binder 统计信息"
    start_pattern: "^------ BINDER STATS"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'BINDER STATS'"
    line_count_estimate: 8400

  binder_state:
    priority: HIGH
    category: "binder"
    boundary_type: "dash_separator"
    description: "Binder 状态 (最长章节之一)"
    start_pattern: "^------ BINDER STATE"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'BINDER STATE'"
    line_count_estimate: 51600
    size_estimate_mb: 15

  # ============================================================================
  # 4. dumpsys 输出 (系统服务) - 最重要
  # ============================================================================
  dumpsys_critical:
    priority: CRITICAL
    category: "dumpsys"
    boundary_type: "dash_separator"
    description: "Dumpsys Critical 系统服务 (SurfaceFlinger等)"
    start_pattern: "^------ DUMPSYS CRITICAL"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'DUMPSYS CRITICAL'"
    line_count_estimate: 35600
    size_estimate_mb: 10

  dumpsys_high:
    priority: HIGH
    category: "dumpsys"
    boundary_type: "dash_separator"
    description: "Dumpsys High 系统服务"
    start_pattern: "^------ DUMPSYS HIGH"
    end_pattern: "^------ \\d+\\.\\d+s was the duration of 'DUMPSYS HIGH'"
    line_count_estimate: 12400
    size_estimate_mb: 3.5

  dumpsys_normal:
    priority: MEDIUM
    category: "dumpsys"
    boundary_type: "dash_separator"
    description: "Dumpsys Normal 系统服务 (最大章节，包含所有子章节)"
    start_pattern: "^------ DUMPSYS NORMAL"
